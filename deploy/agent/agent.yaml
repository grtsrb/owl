# Owl agent. Easiest: Settings → Clusters → Add cluster in the UI, which gives you this
# file (with your agent image filled in) and a separate agent-secret-<cluster>.yaml with the token:
#
#   kubectl apply -f agent.yaml
#   kubectl apply -f agent-secret-<cluster>.yaml
#
# By hand: create the Secret yourself (the token is shown once by the server):
#   kubectl -n owl create secret generic owl-agent \
#     --from-literal=OWL_SERVER_URL=https://inventory.example.com --from-literal=OWL_TOKEN=<token>
# (that leaves the token in your shell history — prefer a file you apply and delete).
#
# Permissions are read-only (get/list) and exclude Secrets and ConfigMaps. Keep this in sync with
# internal/agent/collector.go.
apiVersion: v1
kind: Namespace
metadata:
  name: owl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: owl-agent
  namespace: owl
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: owl-agent-read
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: owl-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: owl-agent-read
subjects:
  - kind: ServiceAccount
    name: owl-agent
    namespace: owl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owl-agent
  namespace: owl
  labels: {app.kubernetes.io/name: owl-agent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: owl-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: owl-agent}
    spec:
      serviceAccountName: owl-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: owl:dev # replace with your registry image
          args: [agent]
          envFrom:
            - secretRef: {name: owl-agent}
          env:
            - {name: OWL_INTERVAL, value: 15m}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
