# Service Inventory agent. Easiest: Settings → Clusters → Add cluster in the UI, which gives you this
# file (with your agent image filled in) and a separate agent-secret-<cluster>.yaml with the token:
#
#   kubectl apply -f agent.yaml
#   kubectl apply -f agent-secret-<cluster>.yaml
#
# By hand: create the Secret yourself (the token is shown once by the server):
#   kubectl -n service-inventory create secret generic inventory-agent \
#     --from-literal=INV_SERVER_URL=https://inventory.example.com --from-literal=INV_TOKEN=<token>
# (that leaves the token in your shell history — prefer a file you apply and delete).
#
# Permissions are read-only (get/list) and exclude Secrets and ConfigMaps. Keep this in sync with
# internal/agent/collector.go.
apiVersion: v1
kind: Namespace
metadata:
  name: service-inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-agent
  namespace: service-inventory
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inventory-agent-read
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inventory-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inventory-agent-read
subjects:
  - kind: ServiceAccount
    name: inventory-agent
    namespace: service-inventory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-agent
  namespace: service-inventory
  labels: {app.kubernetes.io/name: inventory-agent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: inventory-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: inventory-agent}
    spec:
      serviceAccountName: inventory-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: service-inventory:dev # replace with your registry image
          args: [agent]
          envFrom:
            - secretRef: {name: inventory-agent}
          env:
            - {name: INV_INTERVAL, value: 15m}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
